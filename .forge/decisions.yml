# Технические решения проекта
# Формат: id, date, decision, why, tags
entries:
  - id: project-guide-versions
    code: DEC-01
    date: "2026-09-06"
    decision: "Фаза 5 — гайд по проекту (skills/project-guide, /forge:guide) вместо отчёта «Что дальше»: один живой версионный документ по эталону Vespera (Playfair + Golos, A4; разделы 00–08; коды P/O всегда + латинские буквы под проект, риски R<n> из id находки; «дефолт», 🔥, «уже работает»). Данные версий — .forge/guide/vX.Y.json (память, коммитит backup.sh; последняя = максимум по имени), видимые HTML + PDF — docs/guide/ (guide-vX.Y.html/.pdf, guide-latest.html; backup.sh коммитит только свои файлы docs/guide вместе с .forge). Номер +0.1 за сборку («после 1.9 — 1.10»), «это версия N» → следующая крупная, старые версии не правятся; built_at отличает собранную версию от оборванной. «Как устроено» дают два картографа по образцу product-mapping (Flow / Entity+Gap) со своим выходом под разделы 01–04; .forge/product-map.json — только подсказка. Принятые решения — из decisions.yml; риски/план/открытые — 4 аналитика (Секретарь решений влит в Аналитика 4) — итого 6 субагентов. Ответы владельца читает Клод и передаёт рендереру разобранный статус: render.py verdict <код> <статус> [текст], по одному коду за вызов; после мержа — прежний merged <slug>. PDF — Chrome headless (Popen + ожидание файла, Chrome 152 не завершается сам). Текст скилла — через skill-creator"
    why: "Владелец хочет документ, который человек со стороны читает целиком (суть, устройство, экраны, решения, риски), а не список «что чинить»; два документа «где мы» — путаница, поэтому гайд заменяет отчёт. Версии в docs/guide/ на виду — это история состояния проекта, ей место не в скрытой .forge; данные отдельно от HTML — чтобы diff версий и обновление после мержа были механическими. Второй извлекатель устройства проекта не нужен — product-mapping уже умеет flows/entities/gaps. Парсер живой речи в скрипте отвергнут критикой (тире, кириллица, «ок» на риск): слова понимает Клод, скрипт получает статус. JSON без PyYAML — как в v7.7.0"
    tags: [pipeline, project-guide, phase-5, versions, render, memory]

  - id: status-report-phase-5
    code: DEC-02
    date: "2026-09-04"
    decision: "ПЕРЕРАБОТАНО в гайд по проекту 2026-09-06 (см. project-guide-versions; скилл и файлы status-report больше не существуют). Было: Фаза 5 «Итог: что дальше» — скилл status-report: данные в .forge/status-report.json, HTML собирает skills/status-report/render.py (только stdlib; режимы render / merged <slug> / link <id> <slug> / summary), Клод HTML руками не пишет. Полная сборка — по слову («собери отчёт»), 4 агента-аналитика; «открой отчёт» — показ без аудита; после мержа finishing зовёт merged <slug>; session-start напоминает через summary. Игнор status-report.html и reports/shots/ гарантирует сам render.py при записи боевого HTML. ROADMAP.md навигатором больше не пишется — витрина для глаз теперь отчёт"
    why: "JSON, а не YAML — на маке владельца нет PyYAML (python3 -c 'import yaml' падает), а json в stdlib. Рендерер вместо HTML руками — урок product-mapping: данные + шаблон не дают сломанной вёрстки, и обновление после мержа становится механическим шагом. Игнор в render.py, а не только в backup.sh — finishing делает git add -A ДО backup.sh, иначе HTML со встроенными снимками (до МБ) уехал бы в историю навсегда. Два документа «где мы» (ROADMAP.md и отчёт) для одного человека — путаница: у них разные оси (знание vs владелец×срочность), витрина оставлена одна"
    tags: [pipeline, status-report, phase-5, render, memory, superseded]

  - id: four-phase-pipeline
    code: DEC-03
    date: "2026-05-14"
    decision: "4-фазный pipeline: new-task → plan → critique → execute (заменил brainstorm/write-plan/execute-plan)"
    why: "Старая схема смешивала понимание задачи и планирование в одну фазу, и не имела отдельного шага критики. Новая разводит: (1) понимание + критерий готовности, (2) план с чекпоинтами, (3) 4 персоны рвут план, (4) реализация по чекпоинтам. Каждая фаза имеет чёткий вход/выход и артефакт в .forge/"
    tags: [pipeline, architecture, workflow]

  - id: native-output-style
    code: DEC-04
    date: "2026-05-14"
    decision: "Output Style 'Forge Concise' — нативный механизм Claude Code, force-for-plugin: true"
    why: "Раньше STYLE правила инжектились в каждый промпт через хук — лишние токены. Нативный Output Style активируется один раз при включении плагина, не жжёт контекст"
    tags: [output-style, performance, native-features]

  - id: bash-safety-hook
    code: DEC-05
    date: "2026-05-14"
    decision: "PreToolUse bash-safety хук блокирует деструктивные паттерны до выполнения"
    why: "rm -rf /, git push --force main, и пр. — должны блокироваться раньше чем дойдут до shell. Хук работает на уровне tool-call, до того как команда отправится в bash"
    tags: [safety, hooks, destructive]

  - id: permission-request-hook
    code: DEC-06
    date: "2026-04-08"
    decision: "PermissionRequest хук вместо Notification для звуков разрешений"
    why: "Notification хук вызывал дублирование звуков — PermissionRequest срабатывает ровно один раз"
    tags: [hooks, sounds, architecture]

  - id: stakes-based-skill-roles
    code: DEC-07
    date: "2026-04-08"
    decision: "Enhanced skill roles с expertise depth и stakes-based pressure"
    why: "Повышает качество выполнения — скилл осознаёт последствия ошибок и действует как эксперт, а не как generic assistant"
    tags: [skills, roles, quality]

  - id: github-sync-via-skill-not-hook
    code: DEC-08
    date: "2026-05-26"
    decision: "Sync вызовы через инструкции в SKILL.md фаз, а не через PostToolUse хук"
    why: "Фаза пайплайна — это серия tool calls (Read+Write+диалог), PostToolUse триггерится на каждый отдельно. SKILL.md инструкция выполняется в нужный момент после полного завершения фазы."
    tags: [github-sync, hooks, architecture]

  - id: gh-cli-not-mcp-from-bash
    code: DEC-09
    date: "2026-05-26"
    decision: "github-sync использует gh CLI а не MCP github tools"
    why: "Логика инкапсулирована в bash-скрипте sync.sh — оттуда MCP недоступен (только из Claude tool_use). gh CLI даёт единое место с проверяемым синтаксисом."
    tags: [github-sync, gh-cli, mcp]

  - id: forge-memory-in-git
    code: DEC-10
    date: "2026-07-06"
    decision: "ОТМЕНА прежнего правила «.forge/ в .gitignore»: память проекта (задачи, планы, идеи, решения, журнал) — часть репозитория; в .forge/.gitignore только runtime-мусор (.inject-state, .last-backup, state.yml, .github-*, graph.json). Автосохранение через skills/memory-backup/backup.sh (session-awareness + finishing + слово «сохрани»/forge:save), напоминание в session-start при несохранённом >24ч, для проектов без удалёнки — предложение приватного репозитория"
    why: "Запрос пользователя: память должна переживать смерть диска и VPS во ВСЕХ проектах. Локальная .forge = единая точка отказа. Git-история памяти — бесплатный бонус (когда и почему менялись решения). Секреты в .forge не пишутся — только названия записей Bitwarden"
    tags: [memory, git, backup, durability, architecture]

  - id: tarik-unknowns-features
    code: DEC-11
    date: "2026-07-05"
    decision: "Забраны 4 приёма из гайда Тарика (Anthropic, 'Finding Your Unknowns'): blindspot pass в new-task (шаг 2.5), вопрос-референс в интервью new-task, секция 'Что увидишь ты' первой в плане и в сводке, обязательный HTML-макет до кода для UI-задач, файл отклонений от плана в execute. Квиз перед мержем — отвергнут пользователем"
    why: "У не-кодера максимум unknown unknowns — blindspot pass закрывает самый опасный квадрант. Реакция на картинку/референс работает у него лучше текста. Отклонения сейчас растворяются молча — файл делает их видимыми на чекпоинтах. Квиз — 'такое себе' (Антон), риск раздражения на каждом мерже"
    tags: [pipeline, new-task, plan, execute, ux]

  - id: no-projects-v2-board
    code: DEC-12
    date: "2026-05-26"
    decision: "Не делаем Projects v2 board, оставляем только README шапку + Pinned Issue"
    why: "Дублирует Pinned Issue по группировке по приоритетам. Требует non-default scope project в gh auth, который отсутствует у большинства пользователей. Pinned Issue + README шапка покрывают боль 'теряю контекст' без этой сложности."
    tags: [github-sync, projects-v2, scope]

  - id: no-jev-model-router
    code: DEC-13
    date: "2026-10-12"
    decision: "Jev (TypeSafe, OpenRouter) НЕ используем для выбора модели помощникам — вместо этого фиксированная таблица «роль → модель + effort» в плагине. Jev оставлен кандидатом только для выбора скилла, когда скиллов станет заметно больше (~100–200)"
    why: "Помощников раздаёт Opus, который видит весь контекст задачи — Jev видел бы только короткое описание: решение хуже, плюс задержка через VPN и лишняя точка отказа, а экономия ~0 (Opus тратит пару слов на выбор модели). Совет сменить модель основного чата не окупается — смена модели сбрасывает кеш"
    tags: [models, cost, jev, routing, choice]

  - id: fast-path-small-changes
    code: DEC-14
    date: "2026-10-12"
    decision: "Разрешён быстрый путь для мелких изменений (правка текста, конфига, одного места в коде): задача → сделать → проверить, без refine/plan/critique. Claude объявляет выбор пути одной строкой, Антон может сказать «давай полный». Смягчает hard rule «NO skipping /new-task even for simple changes» — реализуется отдельной задачей"
    why: "Аудит 2026-09-25 (.forge/reviews/2026-09-25-cross-project-audit.md): полная церемония на любой масштаб — главный минус по удобству; плюс это крупный рычаг экономии токенов (4 критика + план на однострочную правку)"
    tags: [pipeline, cost, ux, choice]

  - id: cost-plan-order
    code: DEC-15
    date: "2026-10-12"
    decision: "Порядок работ по экономии: 0) срочные мелочи — правило «удали старые записи >7» в session-awareness (тихая потеря уроков) и запрет наследования Fable помощниками; 1) «Модели и расходы» + фильтр вывода (проверить RTK) перед сжимателем + A/B на 2–3 старых планах integration в критерии готовности; 2) быстрый путь; 3) «Порядок в памяти и проверка»; 4) «Усиление скиллов по Прорабу». Выпуск осторожный: пилот на integration, каждая новинка выключается в .forge проекта, Codex/Ollama — только если установлены; Codex выключается для проектов с чувствительными данными, логи с секретами — только локальный сжиматель"
    why: "Согласовано с Антоном 2026-10-12 после разбора чатов integration, теста локальных моделей и сравнения с Прорабом; заметки 2026-09-25 (notes/reviews) сводятся в этот же список"
    tags: [cost, models, plan, rollout, choice]

  - id: review-scheme-sonnet-codex
    code: DEC-16
    date: "2026-10-13"
    decision: "Схема проверки шага в плагине (v7.9.0): проверяющим — дифф + задача + критерий; до пяти Sonnet-углов (логика / надёжность / тексты / интерфейс / тесты); на шагах [важное] — второй круг со списком найденного; Codex (gpt-6.1-sol, medium) — второй взгляд; находки подтверждаются пачкой, не скептиком на каждую; финальный Opus — только деньги/прод/удаление, спор, Codex не ответил, проверяющий не уложился. Уточнение к cost-plan-order: Codex включается в проекте ключом codex_review: on; на integration включён по слову Антона (куски кода в OpenAI разрешены)"
    why: "Сравнение на 2 старых шагах integration (.forge/notes/2026-10-13-models-and-costs-measure.md): 1 Sonnet — 5.5 из 32 старых находок; 3 угла — 10.5; 5 углов × 2 круга — 16.5 из 32 (важных 3 из 6), критичных пропусков 0, ~35 своих находок; стоимость $4.7–6.4 против $39–54 у старой (в 6–12 раз дешевле). Антон хотел меньше пропусков ценой части экономии"
    tags: [cost, models, review, codex, choice]

  - id: docs-prorab-adopted
    code: DEC-17
    date: "2026-10-13"
    decision: "Документация и память по образцу Прораба (v7.10.0): иерархия правды + update_map; «не делать» целиком в инжекте; стабильные коды решений DEC-NN (не D-, чтобы не путать с группой D гайда); большие L1-файлы — оглавлением (toc.py); журнал — фрагментами в .forge/journal.d (правило «>7 — удали» убрано); drift-check.py — мёртвые пути и устаревшие доки, одна строка при старте вместе с гайдом. Все скрипты — stdlib, YAML пишется построчно (комментарии сохраняются), служебные отметки — вне репо (~/.claude/forge-state/)"
    why: "Раздел 11 заметки 2026-10-12: память integration растёт (decisions 69 КБ грузились целиком), журнал терял записи, доки врали (lib/, «33 скилла»). Антон включил все 9 пунктов в задачу models-and-costs; сделано в окне пилота 7.9.0"
    tags: [memory, docs, prorab, choice]

  - id: log-compressor-local-first
    code: DEC-18
    date: "2026-10-13"
    decision: "Сжиматель длинного вывода (v7.11.0): RTK не ставим — реальные длинные выводы integration (17 из бенча) не тесты/сборки/git, а разовые sed/python/cat/ssh-цепочки, которые RTK не переписывает. Свой хук: Qwen 3.8 27B локально (лучшее качество бенча 2026-10-12), при неответе/отсутствии — Haiku через claude -p без --bare (--bare на подписке не авторизуется); выключен по умолчанию, сырой вывод всегда доступен (600, вне репо)"
    why: "Бенч 2026-10-12 (Qwen 3.8 3.88 против Haiku 3.47, неверных фактов 14 против 31); живые прогоны 2026-10-13: Qwen прогретая 21 с, холодная > 60 с, Haiku 14 с"
    tags: [cost, logs, local-model, choice]

  - id: ponytail-three-rules
    code: DEC-19
    date: "2026-10-20"
    decision: "Три правила из Ponytail (v7.13.0): 1) лесенка перед кодом в delivery-bar.md — «лучший код — тот, который не написан»: нужно ли → есть в проекте → стандартная библиотека → платформа → установленная зависимость → одна строка → готовая живая библиотека для заметного куска (через чекпоинт) → только потом своё; 2) пункт 0 чеклиста проверяющего — нагрузка проекта (строка {LOAD} от основного чата, Codex — в task-файле); 3) пометки «упрощено: <что> — переделать, когда <условие>» в коде → группа упрощений гайда: render.py собирает их git grep (-z --untracked, без *.md и .forge) при каждой перерисовке, коды не переиспользуются, сбор снимает только «дефолт» без задачи (dropped_by: scan) и возвращает при возврате пометки; буква S, а если S в гайде уже занята проектом — первая свободная (meta.shortcut_letter); упрощения узнаются по shortcut_key. Сам Ponytail не ставим"
    why: "Антону понравились все три (2026-10-17) и девиз «лучший код — тот, который не написан, всегда искать готовые библиотеки» (2026-10-20). Ponytail — второй постоянно включённый набор правил: спорит с пайплайном, TDD «тест сначала падал» и Output Style. Жёстко S нельзя: гайд проекта strip уже держит свою группу S1–S3, а коды гайда между версиями не меняются. Валидатор буквы S не делали — правило в тексте (Прагматик)"
    tags: [delivery-bar, review, guide, ponytail, choice]
