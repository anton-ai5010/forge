language: javascript, python, markdown
naming:
  files: kebab-case
  directories: kebab-case
  js_functions: camelCase
  js_variables: camelCase
  python_functions: snake_case
  python_variables: snake_case
  constants: UPPER_SNAKE_CASE
  skills: kebab-case (директория + SKILL.md внутри)
  commands: kebab-case (init.md, brainstorm.md)
structure:
  forge-plugin/hooks/: "Конфигурация хуков"
  forge-plugin/agents/: "Промпт-шаблоны субагентов"
  forge-plugin/commands/: "Описания команд (MD)"
  forge-plugin/skills/: "Скиллы (SKILL.md + поддержка)"
  forge-plugin/docs/: "Документация проекта"
  forge-plugin/tests/: "Тестовые промпты"
  ideas/: "Идеи и предложения"
patterns:
  skill_structure: "директория/{SKILL.md, support-files}"
  frontmatter: "YAML frontmatter с name и description в SKILL.md"
  stack_hints: "skills/*/stack-hints/{language}.md"
  hook_format: "hooks.json с matcher и command"
  agent_model: "у каждого помощника явная модель по forge-plugin/docs/model-roles.md (frontmatter agents/*.md или model в вызове); новая роль — строка в таблице + строка инвентаря (тест test-model-roles.sh)"
  codex_review: "Codex-проверка включается в проекте ключом `codex_review: on` в .forge/index.yml; по умолчанию выключена"
  log_compressor: "сжиматель длинного вывода включается ключом `log_compressor: on` в .forge/index.yml; по умолчанию выключен"
  nested_claude: "вложенный вызов claude из хуков — с FORGE_NESTED=1; каждый хук плагина первой строкой молчит при нём"
update_map:
  - changed: "скилл (новый, переименованный, удалённый)"
    update: ["CLAUDE.md (корень)", "Commands Reference в CLAUDE.md", "forge-plugin/skills/using-forge/SKILL.md"]
  - changed: "хук (hooks/*.sh)"
    update: ["forge-plugin/tests/hooks/", "forge-plugin/hooks/hooks.json"]
  - changed: "команда (commands/*.md)"
    update: ["Commands Reference в CLAUDE.md", "forge-plugin/COMMANDS.md"]
  - changed: "версия плагина"
    update: ["forge-plugin/.claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "forge-plugin/.claude-plugin/marketplace.json"]
  - changed: "роль помощника (agents/*.md, модель)"
    update: ["forge-plugin/docs/model-roles.md (таблица + инвентарь)"]
