# Уроки и инсайты проекта
# Формат: id, date, learning, context, tags
entries:
  - id: gh-milestone-by-title-not-number
    date: "2026-07-10"
    summary: "github-sync create-task передаёт номер milestone в `gh issue create --milestone`, но gh там принимает ИМЯ цели, не число — привязка молча падает ('could not add to milestone 20: not found'), Issue создаётся без цели. Обход: передать title цели вместо номера. Корневой фикс: в sync.sh create-task конвертировать номер→title перед --milestone (или сразу принимать title). Процедура new-task в github-sync SKILL.md тоже учит передавать <milestone-num> — тоже под правку"
    tags: [github-sync, gh-cli, milestone, bug]
    source: "Прогон create-task .forge/tasks/2026-07-07-confidence-in-memory.md 20 → ошибка; повтор с именем 'Надёжность памяти проекта' → Issue #18 привязался. Проверено: gh issue view 18 → milestone: Надёжность памяти проекта"
  - id: git-tests-must-isolate-cwd
    date: "2026-07-06"
    summary: "Тесты с git-командами обязаны ГАРАНТИРОВАТЬ изоляцию: cd внутри $(command substitution) не переживает подстановку — кейсы молча гонялись в реальном репозитории (испачкан README, затёрт .gitignore, 4 мусорных коммита улетели в origin). Правило: new_repo — обычная функция без $(), в начале сьюта cd в mktemp, плюс assert что cwd ≠ репозиторий плагина перед любой git-командой"
    tags: [testing, bash, git, isolation, cwd]
    source: "test-memory-backup.sh v1 — прогон в реальном репо, пришлось чистить origin"
  - id: separate-understanding-from-planning
    date: "2026-05-14"
    summary: "Понимание задачи и планирование — это разные фазы. Смешивать = планировать не то. Phase 1 (new-task) производит критерий готовности ДО Phase 2 (plan), иначе план дрейфует"
    tags: [pipeline, workflow, phases]
    source: "Анализ evals/error-analysis.tsv — половина провалов начиналась с того что задача не была понята до начала планирования"

  - id: critique-before-execute
    date: "2026-05-14"
    summary: "Критика плана 4 параллельными персонами (Skeptic / Pragmatist / Architect / User Advocate) ловит дыры дешевле чем разбираться с ними в Phase 4. Планер влюблён в свой план — свежие глаза нужны"
    tags: [pipeline, critique, quality]
    source: "Pipeline v7.1.0 — добавление Phase 3 (critique) между планом и реализацией"

  - id: native-features-over-hooks
    date: "2026-05-14"
    summary: "Если в Claude Code есть нативный механизм (Output Style, Statusline, PreToolUse) — использовать его, а не дублировать в хуке. Меньше токенов, чище код, проще debug"
    tags: [native, performance, architecture]
    source: "Перенос STYLE-правил из context-inject.sh в нативный Output Style"

  - id: notification-vs-permission-hook
    date: "2026-04-08"
    summary: "Для звуков при запросе разрешений использовать PermissionRequest хук, а не Notification — Notification дублируется"
    tags: [hooks, claude-code, sounds]
    source: "Баг с дублированием звуков в v5.3-v5.4"

  - id: local-model-log-summary-bench
    date: "2026-10-12"
    summary: "Слепой тест сжатия длинных выводов терминала (17 примеров из чатов integration, судьи Opus): Qwen 3.8 27B локально на маке (M5 Pro 48 ГБ, Ollama, think=false) — 3.88/5, лучше Haiku 4.5 (3.47, и Haiku выдумывал больше всех — 31 неверный факт против 14). Qwen 3.6 35B — 3.06, Gemma 4 26B — 2.94. Скорость на пример: Qwen 3.6 ~8с, Gemma ~10с, Haiku ~16с, Qwen 3.8 ~43с. Ни одна модель не держит 5/5 стабильно — пересказ лога это подсказка, сырой вывод должен оставаться доступен"
    tags: [models, cost, local-llm, ollama, benchmark, learning]
    source: "Сессия 2026-10-12: проверка «локальная модель vs Haiku» перед задачей экономии моделей"

  - id: local-tts-macos-pitfalls
    date: "2026-10-23"
    summary: "Локальный русский TTS на маке (arm64): piper-tts из pip падает — espeak-ng-data ищется по пути сборщика (/Users/runner/...), wav выходит пустым; Chatterbox Multilingual — perth.PerthImplicitWatermarker = None (подменить на perth.DummyWatermarker), torch.load нужен map_location под mps, ударения — пакет russian_text_stresser из git+https://github.com/Vuizur/add-stress-to-epub (в PyPI нет); скорость — 12–27 с на фразу 60–90 символов. Rubberband в brew-ffmpeg нет — тембр через asetrate+aresample+atempo"
    tags: [voice, tts, macos, learning]
    source: "Проба голосов для задачи voice-notifications, 2026-10-23"

  - id: claude-p-async-hooks-and-plugin-dir
    date: "2026-10-23"
    summary: "Живые проверки хуков через `claude -p`: (1) асинхронные хуки (`async: true`) обрываются, когда `-p` завершается — их результата нет в журнале сессии; проверять такой хук — синхронной копией через `--settings '{\"hooks\":{…}}'`; (2) `--plugin-dir` с плагином того же имени, что установленный (forge), даёт CLAUDE_PLUGIN_ROOT установленной версии, а `enabledPlugins:{forge@forge-marketplace:false}` выключает и пробный — переименовать копию (name в plugin.json) или подключать скрипт хука напрямую. В stop_hook_summary видно, какие хуки сработали."
    tags: [hooks, testing, claude-code, learning]
    source: "Чекпоинт B задачи voice-notifications, 2026-10-23"
